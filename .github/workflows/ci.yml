name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable && yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - name: Check that the Nitro code is up to date
        run: yarn workspace with-nitro nitrogen && git diff --exit-code

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: corepack enable && yarn install --immutable
      - name: Build the release APK
        working-directory: apps/example
        run: |
          yarn expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=2.12.1 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the end-to-end checks on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install apps/example/android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output maestro-report.xml apps/example/e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable && yarn install --immutable
      - name: Build for the iOS simulator
        working-directory: apps/example
        run: |
          yarn expo prebuild --platform ios --no-install
          cd ios
          pod install
          xcodebuild build \
            -workspace Workletsexamples.xcworkspace \
            -scheme Workletsexamples \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
